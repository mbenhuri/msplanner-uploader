{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card error">
  <h2>{{ title }}</h2>
  <p>{{ message }}</p>
  {% if detail %}<p class="hint">{{ detail }}</p>{% endif %}
  <p><a href="{{ url_for('main.index') }}">Back</a></p>
</section>
{% endblock %}
